spring.application.name=faq-ia-api

# Em nuvem (Render, etc.) a porta e definida pela variavel PORT
server.port=${PORT:8080}

# Banco H2 em memoria
spring.datasource.url=jdbc:h2:mem:faqdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# IMPORTANTE: a chave NUNCA fica escrita aqui. ${ANTHROPIC_API_KEY}
# le o valor de uma variavel de ambiente do sistema operacional (ou
# configurada no Render/IntelliJ). Assim, o arquivo pode ir pro
# GitHub com seguranca -- a chave de verdade nunca aparece no codigo.
anthropic.api.key=${ANTHROPIC_API_KEY}
anthropic.api.model=claude-haiku-4-5-20251001

springdoc.swagger-ui.path=/swagger-ui.html
demo.access.key=${DEMO_ACCESS_KEY:}
